<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Lockdown Store Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --primary: #1a237e;
            --primary-light: #283593;
            --primary-dark: #0d1445;
            --secondary: #ff6b6b;
            --accent: #4ecdc4;
            --gold: #ffd93d;
            --success: #6bcb77;
            --danger: #ff6b6b;
            --warning: #ffd93d;
            --info: #4d96ff;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
            --text-light: #636e72;
            --text-muted: #b2bec3;
            --border: #dfe6e9;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --header-height: 60px;
            --bottom-nav-height: 64px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== Reset & Base ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-top: var(--header-height);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        body.admin-page {
            padding-left: 250px;
            padding-bottom: 0;
        }
        @media (max-width: 767px) {
            body.admin-page {
                padding-left: 0;
                padding-bottom: calc(var(--bottom-nav-height) + 16px);
            }
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        img {
            max-width: 100%;
            display: block;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            font-size: inherit;
        }
        input,
        textarea,
        select {
            font-family: inherit;
            font-size: inherit;
            outline: none;
            border: none;
        }
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mb-16 {
            margin-bottom: 16px;
        }
        .gap-8 {
            gap: 8px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== Toast ===== */
        #toast-container {
            position: fixed;
            top: 80px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 360px;
            width: 100%;
        }
        .toast {
            background: var(--card-bg);
            color: var(--text);
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-hover);
            border-left: 4px solid var(--primary);
            animation: slideInRight 0.4s ease;
            font-size: 14px;
            font-weight: 500;
        }
        .toast.success {
            border-left-color: var(--success);
        }
        .toast.error {
            border-left-color: var(--danger);
        }
        .toast.warning {
            border-left-color: var(--warning);
        }
        @keyframes slideInRight {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== Loading Spinner ===== */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== Header ===== */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: var(--card-bg);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }
        #header .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        #header .logo span {
            color: var(--gold);
        }
        #header .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #header .header-actions button {
            font-size: 20px;
            color: var(--text-light);
            transition: var(--transition);
            padding: 4px;
        }
        #header .header-actions button:hover {
            color: var(--primary);
        }
        .auth-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-muted);
            display: inline-block;
            transition: var(--transition);
            border: 2px solid var(--card-bg);
            box-shadow: 0 0 0 2px var(--border);
        }
        .auth-dot.logged-in {
            background: var(--success);
            box-shadow: 0 0 0 2px var(--success);
        }

        /* ===== Sidebar ===== */
        #admin-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 250px;
            background: var(--primary-dark);
            color: #fff;
            padding: 24px 16px;
            overflow-y: auto;
            z-index: 1000;
            transition: var(--transition);
        }
        #admin-sidebar .sidebar-logo {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #fff;
        }
        #admin-sidebar .sidebar-logo span {
            color: var(--gold);
        }
        #admin-sidebar .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: rgba(255, 255, 255, 0.7);
            transition: var(--transition);
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        #admin-sidebar .sidebar-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        #admin-sidebar .sidebar-link.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        #admin-sidebar .sidebar-link i {
            width: 20px;
            text-align: center;
        }

        @media (max-width: 767px) {
            #admin-sidebar {
                left: -280px;
                width: 280px;
                transition: var(--transition);
            }
            #admin-sidebar.open {
                left: 0;
            }
            #admin-sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 999;
            }
            #admin-sidebar-overlay.open {
                display: block;
            }
            #header .menu-toggle {
                display: block;
            }
        }
        @media (min-width: 768px) {
            #header .menu-toggle {
                display: none;
            }
        }

        /* ===== Admin Bottom Nav (mobile) ===== */
        .admin-bottom-nav {
            display: none;
        }
        @media (max-width: 767px) {
            .admin-bottom-nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: var(--bottom-nav-height);
                background: var(--card-bg);
                box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
                z-index: 1000;
                border-top: 1px solid var(--border);
                align-items: center;
                justify-content: space-around;
            }
            .admin-bottom-nav .nav-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                font-size: 9px;
                color: var(--text-muted);
                transition: var(--transition);
                padding: 4px 8px;
                cursor: pointer;
            }
            .admin-bottom-nav .nav-item i {
                font-size: 18px;
            }
            .admin-bottom-nav .nav-item.active {
                color: var(--primary);
            }
        }

        /* ===== Page Sections ===== */
        .page-section {
            display: none;
            padding: 16px 16px 20px;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeUp 0.3s ease;
        }
        .page-section.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--primary);
        }

        /* ===== Admin Stats ===== */
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (min-width: 600px) {
            .admin-stats {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .stat-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat-card .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-light);
        }

        /* ===== Tables ===== */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 12px 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--card-bg);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 600px;
        }
        table th {
            background: var(--primary);
            color: #fff;
            padding: 10px 12px;
            text-align: left;
            white-space: nowrap;
        }
        table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        table tr:hover td {
            background: #f8f9fa;
        }
        table td img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: var(--radius-xs);
        }
        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .actions-cell button {
            padding: 4px 12px;
            border-radius: var(--radius-xs);
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition);
        }
        .btn-edit {
            background: var(--info);
            color: #fff;
        }
        .btn-edit:hover {
            background: #3a7bd5;
        }
        .btn-delete {
            background: var(--danger);
            color: #fff;
        }
        .btn-delete:hover {
            background: #e55a5a;
        }
        .btn-add {
            background: var(--success);
            color: #fff;
            padding: 8px 20px;
            border-radius: var(--radius-xs);
            font-weight: 500;
            margin-bottom: 12px;
            transition: var(--transition);
        }
        .btn-add:hover {
            background: #5cb85c;
            transform: scale(1.02);
        }
        .status-select {
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: #fff;
            font-size: 12px;
            font-weight: 500;
        }
        .slider-preview {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .slider-preview .slide-item {
            background: var(--card-bg);
            padding: 8px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            text-align: center;
        }
        .slider-preview .slide-item img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: var(--radius-xs);
        }
        .slider-preview .slide-item button {
            margin-top: 4px;
            padding: 4px 12px;
            background: var(--danger);
            color: #fff;
            border-radius: var(--radius-xs);
            font-size: 12px;
            transition: var(--transition);
        }
        .slider-preview .slide-item button:hover {
            background: #e55a5a;
        }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            animation: slideUp 0.3s ease;
            box-shadow: var(--shadow-hover);
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal .modal-close {
            float: right;
            font-size: 22px;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            padding: 4px;
        }
        .modal .modal-close:hover {
            color: var(--danger);
        }
        .modal .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-light);
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-xs);
            transition: var(--transition);
            background: var(--bg);
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--primary);
            background: #fff;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border-radius: var(--radius-xs);
            font-weight: 600;
            transition: var(--transition);
            margin-top: 4px;
        }
        .btn-submit:hover {
            background: var(--primary-light);
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state i {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .empty-state h3 {
            font-weight: 500;
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 14px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 400px) {
            .modal {
                padding: 16px;
            }
            .stat-card .stat-number {
                font-size: 22px;
            }
            table {
                font-size: 11px;
                min-width: 500px;
            }
            table th,
            table td {
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body class="admin-page">

    <!-- ===== TOAST CONTAINER ===== -->
    <div id="toast-container"></div>

    <!-- ===== HEADER ===== -->
    <header id="header">
        <div class="logo">Lockdown <span>Store</span> <span style="font-size:12px;font-weight:400;color:var(--text-muted);margin-left:6px;">Admin</span></div>
        <div class="header-actions">
            <button class="menu-toggle" id="menuToggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
            <button id="authToggle" aria-label="Account">
                <span class="auth-dot" id="authDot"></span>
            </button>
        </div>
    </header>

    <!-- ===== SIDEBAR OVERLAY (mobile) ===== -->
    <div id="admin-sidebar-overlay"></div>

    <!-- ===== SIDEBAR ===== -->
    <nav id="admin-sidebar">
        <div class="sidebar-logo">Lockdown <span>Store</span></div>
        <a class="sidebar-link active" data-page="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a class="sidebar-link" data-page="products"><i class="fas fa-box"></i> Products</a>
        <a class="sidebar-link" data-page="orders"><i class="fas fa-shopping-bag"></i> Orders</a>
        <a class="sidebar-link" data-page="slider"><i class="fas fa-images"></i> Slider</a>
        <a class="sidebar-link" data-page="messages"><i class="fas fa-envelope"></i> Messages</a>
        <a class="sidebar-link" data-page="logout" style="margin-top:20px;border-top:1px solid rgba(255,255,255,0.1);padding-top:16px;"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>

    <!-- ===== BOTTOM NAV (mobile) ===== -->
    <nav class="admin-bottom-nav">
        <a class="nav-item active" data-page="dashboard"><i class="fas fa-chart-pie"></i><span
